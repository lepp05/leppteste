<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex gpt 04 if / else</title>
</head>
<body>
    <p>Digite seu nome: <input type="text" name="nome" id="nome" ></p>
    <p>Agora sua idade: <input type="number" name="idade" id="idade"></p>
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>

    <script>
        function verificar(){
            var vnome = document.querySelector('input#nome').value
            var vidade = Number(document.querySelector('input#idade').value)
            var res = document.querySelector('div#res')
            res.innerHTML = `<p> ${vnome} sua idade é : ${vidade} anos </p>` 

            if (vidade >= 18) {
                res.innerHTML += 'Vc pode entrar na festa'
                res.style.color =  'green'

            } else {
                res.innerHTML += 'Vc não pode entrar na festa'
                res.style.color = 'red'
            }
        }
    </script>
</body>
</html>
