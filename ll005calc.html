<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora </title>

</head>
<body>
    <input type="number" name="num1" id="num1">
    <input type="number" name="num2" id="num2">
    <br>
    <input type="button" value="somar" onclick="calcular('+')">
    <input type="button" value="subtrair" onclick="calcular('-')">
    <input type="button" value="dividir" onclick="calcular('/')">
    <input type="button" value="multiplicar" onclick="calcular('*')">
    <br>
    <div id="res"></div>
    <div id="pi"></div>

    <script>
        function calcular(operacao){
            const n1 = Number(document.getElementById('num1').value)
            const n2 = Number(document.getElementById('num2').value)
            const res = document.getElementById('res')
            const pi = document.getElementById('pi')

            let resultado

            if (operacao =='+'){
                resultado = n1 + n2
                } else if ( operacao == '-'){
                    resultado = n1 - n2
                } else if (operacao == '/'){
                    resultado = n1 / n2 
                } else if (operacao == '*'){
                    resultado = n1*n2
                }
                res.innerHTML = `${resultado}`

           /*const ultimoDigito = String(resultado).slice(-1)    
            
            if (['0','2','4','6','8'].includes(ultimoDigito)) {

                pi.innerHTML = 'numero par'
                
            } else {
                pi.innerHTML = 'numero impar'
            } 
        }*/
                
        if (resultado % 2 == 0){
            pi.innerHTML = 'par'
        } else {
            pi.innerHTML = 'impar'
        }}
    </script>
</body>
</html>
